name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per PR/branch: a new push cancels the previous, still-running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # paths-filter lists a PR's changed files through the API

jobs:
  # Decide which components changed, so each suite runs only when it's relevant.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # On push to main this compares against the previous commit; on PRs, against the base branch.
          filters: |
            backend:
              - 'backend/**'
              - 'frontend/e2e/fixtures/**'      # backend contract test loads the editor's export
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'backend/example_flow.json'     # frontend export test compares against it
              - '.github/workflows/ci.yml'

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest

  frontend:
    name: Frontend lint, type-check & unit tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check & build
        run: npm run build
      - name: Unit & component tests
        run: npm test

  frontend-e2e:
    name: Frontend end-to-end tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npm run e2e
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # The single check branch protection requires. It always runs and passes only if
  # every suite that ran passed. Suites skipped because their component didn't
  # change count as passing, so a docs-only PR can still merge.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, backend, frontend, frontend-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'map(.result) | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
